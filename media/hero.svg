<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="100%" role="img" shape-rendering="crispEdges" aria-label="Search result verification pipeline. Private file, recorded: precision 0.71 to 0.73 on 10 held-out products and 0.79 pooled over 4 folds. Scripted sample: 8 of 8 products replay with no key.">
<rect width="1200" height="470" fill="#0e1117"/>
<rect x="1" y="1" width="1198" height="468" fill="none" stroke="#2c333d" stroke-width="2"/>
<rect x="0" y="0" width="8" height="470" rx="0" fill="#7f9bb8"/>
<text x="48" y="54" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e" letter-spacing="2">SEARCH RESULT VERIFICATION PIPELINE</text>
<text x="48" y="112" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#e6e9ee" font-weight="700">Keep only the search results</text>
<text x="48" y="164" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="44" fill="#e6e9ee" font-weight="700">that are for the exact product</text>
<text x="48" y="212" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#8b949e">One model call per product. An empty answer is a valid answer.</text>
<rect x="48" y="244" width="352" height="168" rx="0" fill="#171c24" stroke="#2c333d" stroke-width="2"/>
<rect x="48" y="244" width="352" height="4" rx="0" fill="#7f9bb8"/>
<text x="70" y="284" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#7f9bb8" letter-spacing="1">PRIVATE FILE</text>
<text x="70" y="342" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#e6e9ee" font-weight="700">0.71 to 0.73</text>
<text x="70" y="374" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">precision, 10 held-out</text>
<text x="70" y="402" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">products, 4 runs</text>
<rect x="424" y="244" width="352" height="168" rx="0" fill="#171c24" stroke="#2c333d" stroke-width="2"/>
<rect x="424" y="244" width="352" height="4" rx="0" fill="#7f9bb8"/>
<text x="446" y="284" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#7f9bb8" letter-spacing="1">PRIVATE FILE</text>
<text x="446" y="342" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#e6e9ee" font-weight="700">0.79</text>
<text x="446" y="374" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">precision, pooled over</text>
<text x="446" y="402" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">4 folds of 50 products</text>
<rect x="800" y="244" width="352" height="168" rx="0" fill="#171c24" stroke="#2c333d" stroke-width="2"/>
<rect x="800" y="244" width="352" height="4" rx="0" fill="#4f9a6f"/>
<text x="822" y="284" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#4f9a6f" letter-spacing="1">SCRIPTED SAMPLE</text>
<text x="822" y="342" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="40" fill="#e6e9ee" font-weight="700">8 of 8</text>
<text x="822" y="374" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">sample products replay</text>
<text x="822" y="402" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">with no key</text>
<text x="48" y="452" font-family="SF Mono, Menlo, Consolas, monospace" font-size="23" fill="#8b949e">python3 run.py sample/catalog.json --cache-dir sample/cache --replay</text>
</svg>
